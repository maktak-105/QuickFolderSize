name: Build and upload distribution asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to update, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install MinGW and Python
        shell: pwsh
        run: choco install mingw python --yes --no-progress

      - name: Install WebView2 SDK headers
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2-sdk.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2' -OutFile $sdk
          Expand-Archive -LiteralPath $sdk -DestinationPath $dir -Force
          "WEBVIEW2_INCLUDE=$dir\build\native\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build native application
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }

      - name: Package distribution files
        shell: pwsh
        run: |
          $files = @(
            'dist/QuickFolderSize.exe',
            'dist/QuickFolderSize_cli.exe',
            'dist/WebView2Loader.dll',
            'docs/distribution/readme.txt',
            'docs/distribution/readme_jp.txt',
            'docs/distribution/history.txt',
            'docs/distribution/history_jp.txt',
            'docs/distribution/mcp_readme.txt',
            'docs/distribution/mcp_readme_jp.txt',
            'docs/distribution/LICENSE.txt',
            'docs/distribution/LICENSE_jp.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
          $staging = Join-Path $env:RUNNER_TEMP 'QuickFolderSize-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $staging -Force
          }

          # src/integrations/mcp-server/: ship the source (optional companion tool for AI agents), minus
          # node_modules (end users run `npm install`; see mcp_readme.txt) and scan-reports
          # (transient scan output from a dev machine, must never ship in a release).
          $mcpDest = Join-Path $staging 'mcp-server'
          New-Item -ItemType Directory -Path $mcpDest -Force | Out-Null
          Get-ChildItem -LiteralPath 'src/integrations/mcp-server' -Exclude 'node_modules', 'scan-reports' |
            Copy-Item -Destination $mcpDest -Recurse -Force

          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'QuickFolderSize-binary.zip') -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'
          $lines = @()
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'QuickFolderSize-binary.zip'
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToUpper()
          $lines += "$zipHash  QuickFolderSize-binary.zip"
          $lines += ""
          $lines += "# Binaries inside archive:"
          $binFiles = @('dist/QuickFolderSize.exe', 'dist/QuickFolderSize_cli.exe', 'dist/WebView2Loader.dll')
          foreach ($f in $binFiles) {
            if (Test-Path -LiteralPath $f) {
              $h = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToUpper()
              $name = Split-Path -Leaf $f
              $lines += "$h  $name"
            }
          }
          $lines | Set-Content -Path $checksumFile -Encoding utf8

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            QuickFolderSize-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickFolderSize ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Download `QuickFolderSize-binary.zip`, extract every file into the same folder, and run `QuickFolderSize.exe`.

            Keep `QuickFolderSize.exe` and `WebView2Loader.dll` together (the UI is embedded in the EXE). `QuickFolderSize_cli.exe` is an optional standalone command-line build for scripts and AI agents — see the CLI section in README.md.
            Windows 11 already includes WebView2 Runtime. On some Windows 10 / LTSC / Server PCs, install Microsoft Edge WebView2 Runtime (Evergreen).

            Also included: `mcp-server/`, an optional MCP server for AI agents like Claude Code (requires Node.js; run `npm install` once before starting it). See `mcp_readme.txt`.
